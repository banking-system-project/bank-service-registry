apiVersion: v1
kind: PersistentVolume
metadata:
  name: bankdb-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  hostPath:
    #    path: "/mnt/data"  # - for Unix/Linux
    path: "/run/desktop/mnt/host/c/temp/testfiles"
    type: DirectoryOrCreate
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bankdb-pvc
spec:
  resources:
    requests:
      storage: 1Gi
  storageClassName: manual
  accessModes:
    - ReadWriteOnce


---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bankdb
  labels:
    name: bankdb
    app: banking-system
spec:
  selector:
    matchLabels:
      name: bankdb
      app: banking-system
  serviceName: bankdb
  replicas: 1
  template:
    metadata:
      labels:
        name: bankdb
        app: banking-system
    spec:
      containers:
        - name: bankdb
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root
          ports:
            - containerPort: 3306
              name: bankdb
          volumeMounts:
            - name: bank-initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: bank-persistent-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: bank-initdb
          configMap:
            name: bank-initdb-cm
        - name: bank-persistent-storage
          persistentVolumeClaim:
            claimName: bankdb-pvc

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-initdb-cm
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS temp;

---
apiVersion: v1
kind: Service
metadata:
  name: bankdb
spec:
  clusterIP: None
  selector:
    app: banking-system
  ports:
    - port: 3306

---
apiVersion: v1
kind: Service
metadata:
  name: bankdb-lb
spec:
  type: NodePort
  selector:
    app: banking-system
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30005

